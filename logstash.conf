# =========================================================================
# LOGSTASH PIPELINE CONFIGURATION
# =========================================================================

input {
  file {
    # Path inside the Logstash container where the shared volume is mounted
    path => "/var/log/app/library-prod.log"
    start_position => "beginning"
    sincedb_path => "/dev/null" # Allows re-reading files for local testing
    codec => "plain"
  }
}

filter {
  # Parse the updated pattern: Timestamp | Level | PID | Thread | Logger | Message
  dissect {
    mapping => {
      "message" => "%{timestamp} | %{level} | %{pid} | [%{thread}] | %{logger} | %{log_message}"
    }
  }

  # Clean up whitespace padding from fields
  mutate {
    strip => ["level", "pid"]
  }

  # Match the log timestamp with ELK internal system timestamp (@timestamp)
  date {
    match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
    timezone => "UTC"
  }
}

output {
  # Ship the structured logs to Elasticsearch single-node cluster
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "library-app-logs-%{+YYYY.MM.dd}"
  }

  # Duplicate logs to standard output for container debugging (docker logs library_logstash)
  stdout {
    codec => rubydebug
  }
}