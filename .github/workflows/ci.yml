name: Java CI/CD Pipeline with Testcontainers

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

# Выделяем права доступа для записи отчетов безопасности в интерфейс GitHub
permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем исходный код репозитория
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Настраиваем JDK 17 (Eclipse Temurin) с кэшированием зависимостей
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Инициализируем анализатор кода GitHub CodeQL (обновлен до актуальной версии v4)
      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v4
        with:
          languages: 'java'

      # 4. Быстрая проверка жизнеспособности (Smoke Test) перед тяжелой сборкой.
      # Падает мгновенно (за ~1 минуту), если сломалось ядро системы (авторизация/CRUD/БД).
      - name: Run Fast Application Smoke Test
        run: mvn test -Dtest=LibrarySmokeIntegrationTest -Pprod -B

      # 5. Запуск всех остальных тестов проекта. (Юнит-тесты на H2 и Интеграционные тесты на Testcontainers).
      # Активируем Maven-профиль -Pprod, чтобы подтянуть драйвер PostgreSQL.
      # Спринг сам будет переключать профили среды ("test" или "containers") на основе аннотаций @ActiveProfiles в коде.
      # Используем оператор '!' для исключения уже проверенного smoke-теста, чтобы избежать двойной работы.
      # Убран 'clean', чтобы повторно использовать прогретый Docker-контейнер Testcontainers.
      - name: Build and Run All Remaining Tests via Maven
        run: mvn verify -Dtest=!LibrarySmokeIntegrationTest -Pprod -B

      # 6. Выполняем финальный статический анализ кода (обновлен до актуальной версии v4)
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      # 7. Проверка JaCoCo: парсит суммарный CSV отчет и валит пайплайн, если покрытие < 70%
      # Он учтет покрытие и от юнит-тестов, и от контейнерных интеграционных тестов.
      - name: Validate JaCoCo Code Coverage Threshold (70%)
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          fail-if-coverage-less-than: 70
          generate-coverage-badge: false
          generate-branches-badge: false

      # 8. Сохраняем отчеты тестирования и уязвимостей в артефакты GitHub (доступны 7 дней)
      # Добавлена проверка на существование папки отчетов, чтобы шаг не падал при сетевых таймаутах OWASP.
      - name: Upload Test Coverage and Security Reports
        if: always() # Выполняется в любом случае, чтобы можно было изучить логи упавших тестов
        uses: actions/upload-artifact@v4
        with:
          name: library-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/dependency-check-report/
          retention-days: 7