# Global configuration settings for Prometheus
global:
  scrape_interval: 15s     # How frequently to scrape targets (default is 1m)
  evaluation_interval: 15s # How frequently to evaluate rules (default is 1m)

# A scrape configuration containing exactly one endpoint to monitor:
scrape_configs:
  - job_name: 'spring-actuator'
    metrics_path: '/actuator/prometheus' # The exact path where Spring Boot exports metrics
    static_configs:
      - targets: ['library-app:8080']   # Internal Docker container name and its default port