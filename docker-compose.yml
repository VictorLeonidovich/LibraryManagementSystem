services:
  postgres-db:
    image: postgres:16-alpine
    container_name: library_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-cache:
    image: redis:7.4-alpine
    container_name: library_redis
    # Запускаем сервер Redis с обязательной авторизацией по паролю из .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      # Передаем пароль внутрь redis-cli, чтобы проверка здоровья не возвращала ошибку аутентификации
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  library-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_app
    ports:
      - "${APP_PORT}:8080"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      # Передаем переменные Redis, чтобы Spring Boot в контейнере знал, как подключиться к кэшу
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - applogs:/app/logs # Шарим папку с логами для Logstash
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: library_prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - library-app

  grafana:
    image: grafana/grafana:10.4.1
    container_name: library_grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    container_name: library_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Отключаем авторизацию для упрощения учебной настройки
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Экономим ОЗУ
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - elasticdata:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    container_name: library_logstash
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m" # Экономим ОЗУ
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - applogs:/var/log/app:ro # Читаем логи из общего volume
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    container_name: library_kibana
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  pgdata:
  grafanadata:
  elasticdata:
  applogs: # Именованный volume для передачи логов
  redisdata: # Именованный volume для персистентного хранения кэша Redis на диске хоста