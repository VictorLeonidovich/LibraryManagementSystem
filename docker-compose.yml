services:
  postgres-db:
    image: postgres:16-alpine
    container_name: library_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-cache:
    image: redis:7.4-alpine
    container_name: library_redis
    # Запускаем сервер Redis с обязательной авторизацией по паролю из .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      # Передаем пароль внутрь redis-cli, чтобы проверка здоровья не возвращала ошибку аутентификации
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Локальный SMTP сервер для тестирования отправки почтовых уведомлений
  mailhog:
    image: mailhog/mailhog:latest
    container_name: library_mailhog
    ports:
      - "1025:1025" # SMTP порт приема сообщений
      - "8025:8025" # Web UI порт для просмотра писем через браузер

  # Распределенный легковесный брокер сообщений Apache Kafka в режиме KRaft
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: library_kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Сгенерированный статичный UUID для кластера KRaft
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      # Проверяем, слушает ли контейнер сетевой порт 9092 (возвращает 0, если порт открыт)
      test: [ "CMD", "nc", "-z", "localhost", "9092" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  library-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_app
    ports:
      - "${APP_PORT}:8080"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      # Передаем переменные Redis, чтобы Spring Boot в контейнере знал, как подключиться к кэшу
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Передаем переменные почтового сервера из .env файла
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE}
      NOTIFICATION_STRATEGY: ${NOTIFICATION_STRATEGY}
      # Динамическая привязка хоста Кафки для работы внутри сети Docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Включать архитектуру потоковой обработки данных Kafka следует явно только в работающей сети Docker
      KAFKA_AUTO_STARTUP: "true"
    volumes:
      - applogs:/app/logs # Шарим папку с логами для Logstash
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: library_prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - library-app

  grafana:
    image: grafana/grafana:10.4.1
    container_name: library_grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    container_name: library_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Отключаем авторизацию для упрощения учебной настройки
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Экономим ОЗУ
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - elasticdata:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    container_name: library_logstash
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m" # Экономим ОЗУ
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - applogs:/var/log/app:ro # Читаем логи из общего volume
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    container_name: library_kibana
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  sonarqube:
    image: sonarqube:26.6.0.123539-community
    container_name: library_sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonardata:/opt/sonarqube/data
      - sonarext:/opt/sonarqube/extensions
      - sonarlb:/opt/sonarqube/logs

volumes:
  pgdata:
  grafanadata:
  elasticdata:
  applogs: # Именованный volume для передачи логов
  redisdata: # Именованный volume для персистентного хранения кэша Redis на диске хоста
  sonardata:
  sonarext:
  sonarlb: