# =========================================================================
# DATABASE & CONNECTION POOL CONFIGURATION
# =========================================================================
# Point PostgreSQL dialect for Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Limit Hikari pool for test environment
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=20000

# =========================================================================
# JPA / HIBERNATE SETTINGS
# =========================================================================
spring.jpa.hibernate.ddl-auto=validate
# Switch on the default transactions in OSIV for test predictivity
spring.jpa.open-in-view=false

# =========================================================================
# LOCAL CACHE SETTINGS
# =========================================================================
# Disable caching in tests and dev to avoid requiring Redis to be running
spring.cache.type=none

# =========================================================================
# LIQUIBASE INTEGRATION
# =========================================================================
# Switch on Liquibase to use SQL-migration files to containers
spring.liquibase.enabled=true
# Explicitly override global contexts because profile name 'containers' differs from changelog context
spring.liquibase.contexts=test

# =========================================================================
# CONTAINER MAIL CONFIGURATION
# =========================================================================
# Mail Server Settings with Environment Variable Overrides for Docker Environments
spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:container-library@example.com}
spring.mail.password=${MAIL_PASSWORD:container-password}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}

# =========================================================================
# DISTRIBUTED NOTIFICATION SYSTEM CONFIGURATION
# =========================================================================
# Inside containers we can also change strategy via environment or keep default
notification.strategy=${NOTIFICATION_STRATEGY:sync}

# Spring Kafka Docker Network Topology and Consumer Groups
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:library-notification-containers-group}

# Control flag to prevent internalKafkaListenerEndpointRegistry from failing during integration tests
spring.kafka.listener.auto-startup=${KAFKA_AUTO_STARTUP:false}

# =========================================================================
# LOGGING FILE TARGETS
# =========================================================================
# Profile-specific logging directory and filename matching logback-spring.xml
logging.file.path=./logs
logging.file.name=library-containers