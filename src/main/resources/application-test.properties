# =========================================================================
# DATABASE CONFIGURATION (POSTGRESQL COMPATIBLE H2)
# =========================================================================
# DataSource configuration: Uses an in-memory H2 database with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================================================================
# JPA / HIBERNATE SETTINGS
# =========================================================================
# Hibernate configuration: Dictates how tables are automatically managed and specifies the H2 dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =========================================================================
# LOCAL CACHE SETTINGS
# =========================================================================
# Disable caching in tests and dev to avoid requiring Redis to be running
spring.cache.type=none

# =========================================================================
# LIQUIBASE INTEGRATION
# =========================================================================
# Liquibase configuration: Disables automatic database schema migrations on application startup
spring.liquibase.enabled=false

# =========================================================================
# LOGGING FILE TARGETS
# =========================================================================
# Profile-specific logging directory and filename matching logback-spring.xml
logging.file.path=./logs
logging.file.name=library-test