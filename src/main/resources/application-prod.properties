# =========================================================================
# SERVER CONFIGURATION
# =========================================================================
# Port 8080 is optimal. Nginx is usually installed in front of the application on the live server (443 -> 8080)
server.port=8080

# =========================================================================
# DATABASE CONFIGURATION (POSTGRESQL)
# =========================================================================
# Spring Boot automatically substitutes values from the environment,
# and if there are none (for example, when running locally), it will take the value after the colon.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================================
# JPA / HIBERNATE SETTINGS
# =========================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
# On production, ONLY Liquibase changes the DB schema. validate ensures that entities match tables.
spring.jpa.hibernate.ddl-auto=validate
# Disable Open Session in View to save connection pool on production
spring.jpa.open-in-view=false

# =========================================================================
# LIQUIBASE INTEGRATION
# =========================================================================
spring.liquibase.enabled=true
# Liquibase will only execute changesets where context is not specified or equal to "prod"
spring.liquibase.contexts=prod

# =========================================================================
# REDIS DISTRIBUTED CACHE SETTINGS
# =========================================================================
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Cache Time-To-Live in minutes
app.cache.ttl-minutes=1

# =========================================================================
# SECURITY & JWT SETTINGS
# =========================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:36000000}

# =========================================================================
# MANAGEMENT & ACTUATOR SETTINGS
# =========================================================================
# Expose health, info, and prometheus endpoints via HTTP on production
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# Custom Error Properties
# Hide detailed error traces from application clients
app.errors.show-details=false

# =========================================================================
# LOGGING FILE TARGETS
# =========================================================================
# Profile-specific logging directory and filename matching logback-spring.xml
logging.file.path=./logs
logging.file.name=library-prod