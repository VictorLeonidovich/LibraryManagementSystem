# =========================================================================
# SERVER CONFIGURATION
# =========================================================================
# Port 8080 is optimal. Nginx is usually installed in front of the application on the live server (443 -> 8080)
server.port=8080

# =========================================================================
# DATABASE CONFIGURATION (POSTGRESQL)
# =========================================================================
# Spring Boot automatically substitutes values from the environment,
# and if there are none (for example, when running locally), it will take the value after the colon.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================================
# JPA / HIBERNATE SETTINGS
# =========================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
# On production, ONLY Liquibase changes the DB schema. validate ensures that entities match tables.
spring.jpa.hibernate.ddl-auto=validate
# Disable Open Session in View to save connection pool on production
# spring.jpa.open-in-view=false
spring.jpa.open-in-view=true

# =========================================================================
# LIQUIBASE INTEGRATION
# =========================================================================
spring.liquibase.enabled=true
# Liquibase will only execute changesets where context is not specified or equal to "prod"
spring.liquibase.contexts=prod

# =========================================================================
# REDIS DISTRIBUTED CACHE SETTINGS
# =========================================================================
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Cache Time-To-Live in minutes
app.cache.ttl-minutes=1

# =========================================================================
# PRODUCTION MAIL CONFIGURATION
# =========================================================================
# Production Mail Server Settings via environment variables (defaults to SSL on port 465)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# =========================================================================
# PRODUCTION DISTRIBUTED NOTIFICATION SETTINGS
# =========================================================================
# Production execution strategy controlled strictly by environment variable
notification.strategy=${NOTIFICATION_STRATEGY:sync}

# Production Cluster Kafka Bootstrap Servers Topology
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:library-notification-prod-group}
spring.kafka.listener.auto-startup=${KAFKA_AUTO_STARTUP:false}

# =========================================================================
# SECURITY & JWT SETTINGS
# =========================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:36000000}
# Default System Users Initialization
app.security.default-admin-password=${DEFAULT_ADMIN_PASSWORD:password}
app.security.default-user-password=${DEFAULT_USER_PASSWORD:password}

# Secret token for internal loopback RPC notification service authorization
app.security.internal-token=${INTERNAL_SERVICE_TOKEN:my-super-secret-internal-rpc-token-2026}

# =========================================================================
# MANAGEMENT & ACTUATOR SETTINGS
# =========================================================================
# Expose health, info, and prometheus endpoints via HTTP on production
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# Custom Error Properties
# Hide detailed error traces from application clients
app.errors.show-details=false

# =========================================================================
# LOGGING FILE TARGETS
# =========================================================================
# Profile-specific logging directory and filename matching logback-spring.xml
logging.file.path=./logs
logging.file.name=library-prod