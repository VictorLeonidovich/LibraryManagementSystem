# =========================================================================
# SERVER CONFIGURATION
# =========================================================================
# Server Port
server.port=8080

# =========================================================================
# DATABASE CONFIGURATION (IN-MEMORY H2)
# =========================================================================
# Development Database Configuration (e.g., H2 or Local MySQL)
spring.datasource.url=jdbc:h2:mem:library_dev;DB_CLOSE_DELAY=-1
spring.datasource.username=victor
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Web Console debug
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================================
# JPA / HIBERNATE SETTINGS
# =========================================================================
# JPA / Hibernate Properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# =========================================================================
# LOCAL CACHE SETTINGS
# =========================================================================
# Disable caching in tests and dev to avoid requiring Redis to be running
spring.cache.type=none

# =========================================================================
# SECURITY & JWT SETTINGS
# =========================================================================
# JWT Security Settings (Dev defaults)
app.jwt.secret=my-super-safe-and-ultra-long-secret-key-specifically-for-library-system-2026
app.jwt.expiration=36000000

# =========================================================================
# MANAGEMENT & ACTUATOR SETTINGS
# =========================================================================
# Expose all actuator endpoints via HTTP
management.endpoints.web.exposure.include=*
# Show full database/health details
management.endpoint.health.show-details=always

# Custom Error Properties
app.errors.show-details=true

# =========================================================================
# LOGGING FILE TARGETS
# =========================================================================
# Profile-specific logging directory and filename matching logback-spring.xml
logging.file.path=./logs
logging.file.name=library-dev