# Development Database Configuration (e.g., H2 or Local MySQL)
spring.datasource.url=jdbc:h2:mem:library_dev;DB_CLOSE_DELAY=-1
spring.datasource.username=victor
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# H2 Web Console debug
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Port
server.port=8080

# Expose all actuator endpoints via HTTP
management.endpoints.web.exposure.include=*
# Show full database/health details
management.endpoint.health.show-details=always

app.errors.show-details=true

# Standard Liquibase Integration
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=dev