<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Update book</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container my-2">
    <div class="card">
        <div class="card-body">
            <form action="#" th:action="@{/save-book/{id}(id=${book.id})}" th:object="${book}" method="post">

                <!-- Передаем ID книги при отправке формы -->
                <input type="hidden" th:field="*{id}">

                <div class="row">
                    <div class="form-group col-md-8">
                        <label for="isbn" class="col-form-label">ISBN</label>
                        <input type="text" th:field="*{isbn}" class="form-control" id="isbn" placeholder="ISBN">
                    </div>
                    <div class="form-group col-md-8">
                        <label for="name" class="col-form-label">Book Name</label>
                        <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Book Name">
                    </div>
                    <div class="form-group col-md-8">
                        <label for="description" class="col-form-label">Book Description</label>
                        <input type="text" th:field="*{description}" class="form-control" id="description"
                               placeholder="Book Description">
                    </div>

                    <!-- Добавлен выбор нескольких элементов (multiple) для Many-to-Many связей -->
                    <!-- Категории -->
                    <div class="form-group col-md-8">
                        <label for="categories" class="col-form-label">Categories (Hold Ctrl to select multiple)</label>
                        <select th:field="*{categories}" class="form-control" id="categories" multiple="multiple">
                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}"
                                    th:selected="${book.categories != null and book.categories.contains(category)}">
                            </option>
                        </select>
                    </div>

                    <!-- Авторы -->
                    <div class="form-group col-md-8">
                        <label for="authors" class="col-form-label">Authors (Hold Ctrl to select multiple)</label>
                        <select th:field="*{authors}" class="form-control" id="authors" multiple="multiple">
                            <option th:each="author : ${authors}"
                                    th:value="${author.id}"
                                    th:text="${author.name}"
                                    th:selected="${book.authors != null and book.authors.contains(author)}">
                            </option>
                        </select>
                    </div>

                    <!-- Издатели -->
                    <div class="form-group col-md-8">
                        <label for="publishers" class="col-form-label">Publishers (Hold Ctrl to select multiple)</label>
                        <select th:field="*{publishers}" class="form-control" id="publishers" multiple="multiple">
                            <option th:each="publisher : ${publishers}"
                                    th:value="${publisher.id}"
                                    th:text="${publisher.name}"
                                    th:selected="${book.publishers != null and book.publishers.contains(publisher)}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-3">
                        <input type="submit" class="btn btn-primary" value=" Submit ">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
