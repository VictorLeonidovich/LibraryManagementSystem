<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header</title>
</head>
<body>

<nav th:fragment="header" class="custom-navbar">
    <div class="container nav-container">
        <!-- Логотип системы -->
        <a th:href="@{/}" class="brand-logo">📊 Library<span>Management</span></a>

        <!-- Меню навигации со всеми вкладками -->
        <ul class="nav-menu">
            <li><a th:href="@{/}" class="nav-link">Home</a></li>
            <li><a th:href="@{/books}" class="nav-link">Books</a></li>
            <li><a th:href="@{/authors}" class="nav-link">Authors</a></li>
            <li><a th:href="@{/publishers}" class="nav-link">Publishers</a></li>
            <li><a th:href="@{/categories}" class="nav-link">Categories</a></li>
        </ul>

        <!-- Рабочая форма поиска -->
        <form class="search-form" th:action="@{/books}" method="get">
            <input class="search-input" type="text" name="keyword" th:value="${keyword}" placeholder="Название или ISBN...">
            <button class="search-btn" type="submit">Search</button>
        </form>
    </div>
</nav>

</body>
</html>
