<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Publishers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container my-2">
    <div class="card">
        <div class="card-body">
            <div class="container my-5">
                <p class="my-5">
                    <a href="/add-publisher" class="btn btn-primary">
                        <i class="fas fa-user-plus ml-2"> Add Publisher </i>
                    </a>
                </p>
                <div class="col-md-12">
                    <!-- Check if publishers list is empty -->
                    <h2 th:if="${#lists.isEmpty(publishers)}">No records found.</h2>

                    <!-- If publishers are found -->
                    <div th:unless="${#lists.isEmpty(publishers)}">
                        <table class="table table-stripped table-responsive-md">
                            <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Publisher name</th>
                                <th scope="col">Edit</th>
                                <th scope="col">Delete</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="publisher : ${publishers}">
                                <td th:text="${publisher.id}"></td>
                                <td th:text="${publisher.name}"></td>
                                <td><a th:href="@{/update-publisher/{id}(id=${publisher.id})}" class="btn btn-primary"><i
                                        class="fas fa-edit ml-2"></i></a></td>
                                <td><a th:href="@{/remove-publisher/{id}(id=${publisher.id})}" class="btn btn-primary"><i
                                        class="fas fa-user-times ml-2"></i></a></td>
                            </tr>
                            </tbody>
                        </table>

                        <!-- Pagination Block -->
                        <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-4">
                            <div class="text-secondary">
                                Total publishers: [[${totalItems}]] | Page [[${currentPage + 1}]] of [[${totalPages}]]
                            </div>

                            <nav aria-label="Page navigation">
                                <ul class="pagination mb-0">

                                    <!-- Previous Button -->
                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                        <a class="page-link" th:href="@{/publishers(page=${currentPage - 1}, size=${size})}" aria-label="Previous">
                                            <span aria-hidden="true">&laquo;</span>
                                        </a>
                                    </li>

                                    <!-- Page Numbers Iteration -->
                                    <li class="page-item"
                                        th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
                                        th:classappend="${pageNumber == currentPage} ? 'active'">
                                        <a class="page-link"
                                           th:href="@{/publishers(page=${pageNumber}, size=${size})}"
                                           th:text="${pageNumber + 1}">1</a>
                                    </li>

                                    <!-- Next Button -->
                                    <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                                        <a class="page-link" th:href="@{/publishers(page=${currentPage + 1}, size=${size})}" aria-label="Next">
                                            <span aria-hidden="true">&raquo;</span>
                                        </a>
                                    </li>

                                </ul>
                            </nav>
                        </div>
                        <!-- End of Pagination Block -->

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
