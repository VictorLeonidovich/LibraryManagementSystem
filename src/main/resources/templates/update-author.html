<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Update author</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container my-2">
    <div class="card">
        <div class="card-body">
            <form action="#" th:action="@{/save-author/{id}(id=${author.id})}" th:object="${author}"
                  method="post">

                <!-- Передаем ID автора при отправке формы -->
                <input type="hidden" th:field="*{id}">

                <div class="row">
                    <div class="form-group col-md-8">
                        <label for="name" class="col-form-label">Author Name</label>
                        <input type="text" th:field="*{name}" class="form-control" id="name"
                               placeholder="Author Name">
                    </div>
                    <div style="color: red;"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                        Ошибка валидации
                    </div>
                    <div class="form-group col-md-8">
                        <label for="description" class="col-form-label">Author Description</label>
                        <input type="text" th:field="*{description}" class="form-control" id="description"
                               placeholder="Author Description">
                    </div>
                    <div style="color: red;"
                         th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}">
                        Ошибка валидации
                    </div>
                    <div class="col-md-6 mt-3"> <!-- Добавлен небольшой отступ сверху для кнопки -->
                        <input type="submit" class="btn btn-primary" value=" Submit ">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
