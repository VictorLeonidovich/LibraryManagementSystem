<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Books</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container my-2">
    <div class="card">
        <div class="card-body">
            <div th:switch="${book}" class="container my-5">
                <div class="col-md-12">
                    <table class="table table-striped table-responsive-md">
                        <tr>
                            <td>ISBN</td>
                            <td th:text="${book.isbn}"></td>
                        </tr>
                        <tr>
                            <td>Category</td>
                            <td>
                                <!-- Безопасно выводим категории через запятую. Если список пуст — выведется дефолтный текст -->
                                <span th:if="${!book.categories.isEmpty()}" th:each="cat, iterStat : ${book.categories}">
                                    <span th:text="${cat.name}"></span><th:block th:if="${!iterStat.last}">, </th:block>
                                </span>
                                <span th:if="${book.categories.isEmpty()}" class="text-muted">Без категории</span>
                            </td>
                        </tr>
                        <tr>
                            <td>Book name</td>
                            <td th:text="${book.name}"></td>
                        </tr>
                        <tr>
                            <td>Author name</td>
                            <td>
                                <!-- Безопасно выводим авторов через запятую -->
                                <span th:if="${!book.authors.isEmpty()}" th:each="author, iterStat : ${book.authors}">
                                    <span th:text="${author.name}"></span><th:block th:if="${!iterStat.last}">, </th:block>
                                </span>
                                <span th:if="${book.authors.isEmpty()}" class="text-muted">Автор не указан</span>
                            </td>
                        </tr>
                        <tr>
                            <td>Publisher name</td>
                            <td>
                                <!-- Безопасно выводим издателей через запятую -->
                                <span th:if="${!book.publishers.isEmpty()}" th:each="pub, iterStat : ${book.publishers}">
                                    <span th:text="${pub.name}"></span><th:block th:if="${!iterStat.last}">, </th:block>
                                </span>
                                <span th:if="${book.publishers.isEmpty()}" class="text-muted">Издатель не указан</span>
                            </td>
                        </tr>
                        <tr>
                            <td>Description</td>
                            <td th:text="${book.description}"></td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
